  ==========================================================================
  ✅ CÓMO USARLO
     1) Entrá al producto en Tienda Nube → Descripción → botón </> (código).
     2) Pegá TODO este código en UNA sola caja y guardá.
     3) Creá las variantes del producto con DOS propiedades (nombres EXACTOS):
          • "Pack":            "1 Alfombra" · "Pack x2 Alfombras"
          • "Talle de medias": "Adulto" · "Niño" · "Adulto + Adulto" ·
                               "Adulto + Niño" · "Niño + Niño"
        Tienda Nube arma todas las combinaciones: dejá solo estas 5 y borrá
        el resto:
            1 Alfombra        + Adulto  |  1 Alfombra + Niño
            Pack x2 Alfombras + Adulto + Adulto
            Pack x2 Alfombras + Adulto + Niño
            Pack x2 Alfombras + Niño + Niño
        Cargá en cada una su precio, su "precio promocional/comparado" y su
        stock. La landing LEE esos precios y el stock sola (autoPrecios) y,
        cuando el cliente elige el talle de las medias, marca la combinación
        correcta: el talle llega en el pedido.
        Si no querés pedir talle, poné CONFIG.regalo.talles.activar: false y
        usá solo la propiedad "Pack".
     4) Listo. Se arma así:
          • ARRIBA (caja de compra): estrellas (si las activás), subtítulo,
            beneficios, selector de PACKS con medias de regalo y talle,
            stock real (si es bajo), cuotas,
            envío gratis, íconos y 3 acordeones.
          • ABAJO (ancho completo): cinta animada, calculadora de toques,
            imagen + texto, alfombra interactiva por zonas, el método,
            menos pantalla (comparador), cómo funciona, plan de 4 semanas
            (pestañas), habilidades, comparativa, reseñas, preguntas y cierre.
          • Barra fija abajo con el pack elegido y botón de compra.

  ⚙️ DÓNDE EDITAR: todo en el bloque CONFIG. En los títulos, lo que va entre
     *asteriscos* se pinta con el degradé de la marca (ej: 'Así de *simple*').
     Lo que está entre {{ }} se
     ve RESALTADO EN AMARILLO en la tienda: es un dato a completar. Cuando
     lo completes, borrá las llaves {{ }}.
     Imágenes / videos: van en la carpeta "media" (5 archivos). Subila a un
     lugar público y pegá su dirección en CONFIG.medios.base (ver ahí).
     Mientras esté vacío se ve un recuadro gris en su lugar.

  ⚠️ ANTES DE PUBLICAR
     - Precios: si las variantes tienen precio cargado, se usan esos.
     - Reseñas: están cargadas las 6 opiniones (título, texto, nombre, rol,
       ciudad y etiquetas). "destacada: true" le pone el sello de reseña
       destacada. Se ven las primeras 4 y el resto con "Ver más"
       (resenas.mostrarPrimero). Si tenés la foto del cliente, pegá la URL
       en "foto" (si no, se muestra la inicial).
     - Medias de regalo: la foto ya viene incluida en CONFIG.regalo.imagen.
       Si la querés cambiar, pegá ahí la URL de la foto subida a tu tienda.
     - Calificación (estrellas arriba y resumen): siguen apagadas hasta que
       tengas el promedio real.
     - Stock bajo: en modo 'auto' muestra el stock REAL de la variante solo
       cuando es menor al umbral. No inventes números.
     - Cuotas y medidas: confirmá que coincidan con lo que ofrecés.

  🔧 SI EL SELECTOR DE PACKS NO CAMBIA LA VARIANTE: el selector nativo NO
     se oculta (queda visible como respaldo) y aparece un aviso en la

========================================================================== -->

  /* =====================================================================
     CAJA DE COMPRA
     ===================================================================== */
  function buildTopBar() {
    var T = CONFIG.barraSuperior;
    var node = el('<div class="gpx-root gpx-topbar">' + T.mensajes.map(function (m, i) { return '<div class="gpx-topbar__msg' + (i === 0 ? ' is-on' : '') + '">' + tx(m) + '</div>'; }).join('') + '</div>');
    WIRE.push(function () {
      var ms = $$('.gpx-topbar__msg', node), i = 0;
      if (ms.length < 2) return;
      setInterval(function () {
        var a = ms[i]; i = (i + 1) % ms.length; var b = ms[i];
        a.classList.remove('is-on'); a.classList.add('is-out');
        b.classList.remove('is-out'); b.classList.add('is-on');
        setTimeout(function () { a.classList.remove('is-out'); }, 500);
      }, T.rotarCadaMs || 3500);
    });
    return node;
  }
  function buildRating() {
    var R = CONFIG.rating;
    return el('<div class="gpx-root"><div class="gpx-rating">' + stars(R.puntaje) + '<span>' + tx(R.texto) + '</span></div></div>');
  }
  function buildIntro() {
    var lis = CONFIG.beneficios.map(function (b) { return '<li>' + tick() + '<span>' + tx(b) + '</span></li>'; }).join('');
    return el('<div class="gpx-root gpx-intro"><p class="gpx-sub">' + tx(CONFIG.subtitulo) + '</p><ul class="gpx-bens">' + lis + '</ul></div>');
  }

  function packHTML(p, i) {
    var sel = i === estado.sel;
    var precio = p._precio != null ? money(p._precio) : tx(p.precio);
    var old = p._comparar ? '<div class="gpx-pack__old">' + money(p._comparar) + '</div>' : '';
    var extra = '';
    if (p._comparar && p._precio) {
      var ah = p._comparar - p._precio, pct = Math.round(ah / p._comparar * 100);
      extra += '<span class="gpx-pack__save">Ahorrás ' + money(ah) + ' · ' + pct + '% OFF</span>';
    }
    if (p.unidades > 1 && p._precio) extra += '<span class="gpx-pack__unit">Te queda a ' + money(p._precio / p.unidades) + ' c/u</span>';
    var bon = (p.bonuses || []).map(function (b) {
      return '<div class="gpx-bonus"><span class="gpx-bonus__ic">' + I(b.icon) + '</span><span>' + tx(b.texto) + '</span>' + (b.regalo ? '<span class="gpx-free">Regalo</span>' : '') + '</div>';
    }).join('');
    var thumb = hasSrc(p.imagen) ? '<img src="' + esc(p.imagen) + '" alt="">' : matThumb(p.unidades || 1);
    return '<div class="gpx-pack' + (sel ? ' is-sel' : '') + '" role="radio" tabindex="0" aria-checked="' + sel + '" data-i="' + i + '">'
      + (p.badge ? '<div class="gpx-pack__badge">' + tx(p.badge) + '</div>' : '')
      + '<div class="gpx-pack__top"><span class="gpx-radio"></span><span class="gpx-pack__thumb">' + thumb + '</span>'
      + '<div class="gpx-pack__info"><div class="gpx-pack__name">' + tx(p.nombre) + '</div><p class="gpx-pack__desc">' + tx(p.descripcion) + '</p></div>'
      + '<div class="gpx-pack__prices"><div class="gpx-pack__price">' + precio + '</div>' + old + '</div></div>'
      + (extra ? '<div class="gpx-pack__strip">' + extra + '</div>' : '')
      + (bon ? '<div class="gpx-pack__bonuses">' + bon + '</div>' : '')
      + giftsHTML(p)
      + '</div>';
  }
  /* franja de medias de regalo: un renglón por par, con su selector de talle */
  function giftsHTML(p) {
    if (!RG.activar) return '';
    var n = Math.max(1, p.unidades || 1), h = '';
    for (var k = 0; k < n; k++) {

  function buildBundle() {

    function marcar() {   // cambia la selección sin redibujar (así no se pierden los talles elegidos)

    }

      var h = '';

      list.addEventListener('keydown', function (e) {

  function buildAlfombra() {
    var A = CONFIG.alfombra; if (!A.activar) return null;
    var z = A.zonas.slice(0, 6), cols = Math.min(3, z.length), rows = Math.ceil(z.length / cols);
    var W = 360, H = 240, x0 = 24, y0 = 24, cw = (W - 48) / cols, chh = (H - 48) / rows, zw = Math.min(92, cw - 14), zh = Math.min(76, chh - 14);
    var centros = [], zs = '';
    z.forEach(function (_, i) {
      var c = i % cols, r = Math.floor(i / cols), cx = x0 + cw * c + cw / 2, cy = y0 + chh * r + chh / 2;
      centros.push([cx, cy]);
      zs += '<g class="gpx-zone" data-z="' + i + '" tabindex="0" role="button" aria-label="Zona ' + (i + 1) + '"><rect x="' + (cx - zw / 2) + '" y="' + (cy - zh / 2) + '" width="' + zw + '" height="' + zh + '" rx="14"/><text x="' + cx + '" y="' + (cy + 15) + '" text-anchor="middle">' + (i + 1) + '</text></g>';
    });
    var svg = '<svg class="gpx-mat__svg" viewBox="0 0 ' + W + ' ' + H + '">'
      + '<rect x="6" y="6" width="' + (W - 12) + '" height="' + (H - 12) + '" rx="20" fill="#0E4A39" stroke="' + C.lima + '" stroke-opacity=".35" stroke-width="2"/>'
      + '<rect x="16" y="16" width="' + (W - 32) + '" height="' + (H - 32) + '" rx="12" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>'
      + '<line x1="' + W / 2 + '" y1="16" x2="' + W / 2 + '" y2="' + (H - 16) + '" stroke="#fff" stroke-opacity=".1" stroke-width="2"/>'
      + '<circle cx="' + W / 2 + '" cy="' + H / 2 + '" r="34" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2"/>'
      + zs
      + '<g class="gpx-ballg" style="transform:translate(' + (centros[0][0] + 30) + 'px,' + (centros[0][1] + 24) + 'px)"><circle r="13" fill="#fff" stroke="#0F1A15" stroke-width="1.2"/><path d="M0-5.5l5.2 3.8-2 6.2h-6.4l-2-6.2z" fill="#0F1A15"/><path d="M0-5.5V-13M5.2-1.7l7.4-2.4M3.2 4.5l4.6 6.3M-3.2 4.5l-4.6 6.3M-5.2-1.7l-7.4-2.4" stroke="#0F1A15" stroke-width="1.2"/></g>'
      + '</svg>';
    var dots = z.map(function (_, i) { return '<button type="button" data-z="' + i + '" aria-label="Zona ' + (i + 1) + '"></button>'; }).join('');
    var node = sec('gpx-dark', head(A.kicker, A.titulo, A.texto, true)
      + '<div class="gpx-mat"><div>' + svg + '</div><div class="gpx-zinfo"><div class="gpx-zbody"></div><div class="gpx-zdots">' + dots + '</div></div></div>');
    WIRE.push(function () {
      var cur = -1, auto = null, ball = $('.gpx-ballg', node), body = $('.gpx-zbody', node);
      function show(i) {
        if (i === cur) return; cur = i;
        $$('.gpx-zone', node).forEach(function (g) { g.classList.toggle('is-on', +g.getAttribute('data-z') === i); });
        $$('.gpx-zdots button', node).forEach(function (b) { b.classList.toggle('is-on', +b.getAttribute('data-z') === i); });
        ball.style.transform = 'translate(' + (centros[i][0] + 30) + 'px,' + (centros[i][1] + 24) + 'px)';
        body.innerHTML = '<div class="gpx-fade"><div class="gpx-zinfo__n">' + (i < 9 ? '0' : '') + (i + 1) + '</div><p class="gpx-zinfo__t">' + tx(z[i].t) + '</p><p class="gpx-zinfo__d">' + tx(z[i].d) + '</p></div>';
      }
      function stop() { if (auto) { clearInterval(auto); auto = null; } }
      node.addEventListener('click', function (e) { var t = e.target.closest('[data-z]'); if (t) { stop(); show(+t.getAttribute('data-z')); } });
      node.addEventListener('keydown', function (e) { var t = e.target.closest('.gpx-zone'); if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); stop(); show(+t.getAttribute('data-z')); } });
      show(0);
      if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (en) {
          if (en[0].isIntersecting && auto === null && cur === 0) { auto = setInterval(function () { show((cur + 1) % z.length); }, 2800); io.disconnect(); }
        }, { threshold: .4 });
        io.observe(node);
      }
    });
    return node;
  }

    var cards = R.items.map(function (r, i) {
      var ini = String(r.nombre || '?').replace(/[{}]/g, '').trim().charAt(0).toUpperCase();
      var av = hasSrc(r.foto) ? '<img class="gpx-rv__av" src="' + esc(r.foto) + '" alt="">' : '<span class="gpx-rv__av" aria-hidden="true">' + esc(ini) + '</span>';
      var sub = [r.rol, r.ciudad].filter(function (x) { return x; }).map(tx).join(' · ');
      var tags = (r.tags || []).map(function (t) { return '<span>' + tx(t) + '</span>'; }).join('');
      return '<article class="gpx-rv__card' + (r.destacada ? ' is-top' : '') + '"' + (i >= lim ? ' hidden' : '') + '>'
        + (r.destacada ? '<span class="gpx-rv__badge">' + star('currentColor') + 'Reseña destacada</span>' : '')
        + '<div class="gpx-rv__who">' + av + '<div class="gpx-rv__id"><div class="gpx-rv__n">' + tx(r.nombre) + '</div>' + (sub ? '<div class="gpx-rv__r">' + sub + '</div>' : '') + '</div></div>'
        + stars(5)
        + (r.titulo ? '<h3 class="gpx-rv__t">' + tx(r.titulo) + '</h3>' : '')
        + '<p class="gpx-rv__p">' + tx(r.texto) + '</p>'
        + (tags ? '<div class="gpx-rv__tags">' + tags + '</div>' : '')
        + '</article>';
    }).join('');
    var resto = R.items.length - lim;
    var more = resto > 0 ? '<div class="gpx-rv__more"><button type="button" class="gpx-rv__btn">Ver ' + resto + (resto === 1 ? ' reseña más' : ' reseñas más') + I('chev') + '</button></div>' : '';
    var node = sec('gpx-rvsec', head(R.kicker, R.titulo, '', true) + sum + '<div class="gpx-rv">' + cards + '</div>' + more);
    WIRE.push(function () {
      var b = $('.gpx-rv__btn', node); if (!b) return;
      b.addEventListener('click', function () {
        $$('.gpx-rv__card[hidden]', node).forEach(function (c) { c.hidden = false; c.classList.add('gpx-fade'); });
        b.parentNode.parentNode.removeChild(b.parentNode);
      });
    });
    return node;
  }

  function irAlBundle() {
    var b = $('#gpx-bundle'); if (!b) return;
    var y = b.getBoundingClientRect().top + window.pageYOffset - 90;
    window.scrollTo({ top: y, behavior: 'smooth' });
  }
  function buildCierre() {
    var K = CONFIG.cierre; if (!K.activar) return null;
    var node = sec('gpx-dark gpx-final gpx-center', '<span class="gpx-kicker">' + esc(CONFIG.marca) + '</span><h2 class="gpx-h">' + hx(K.titulo) + '</h2><p class="gpx-lead">' + tx(K.texto) + '</p>'
      + '<button type="button" class="gpx-cta">' + tx(K.boton) + I('ball') + '</button>'
      + '<div class="gpx-final__mini">' + CONFIG.iconosConfianza.map(function (t) { return '<span>' + I(t.icon) + tx(t.texto) + '</span>'; }).join('') + '<span>' + I('truck') + 'Envío gratis</span></div>');
    WIRE.push(function () { $('.gpx-cta', node).addEventListener('click', irAlBundle); });
    return node;
  }

  function buildSticky(anchor) {
    var node = el('<div class="gpx-root gpx-sticky" aria-hidden="true"><div class="gpx-sticky__in"><span class="gpx-sticky__th"></span><div class="gpx-sticky__info"><div class="gpx-sticky__n"></div><div class="gpx-sticky__p"></div></div><button type="button" class="gpx-sticky__b">' + tx(CONFIG.barraFija.boton) + '</button></div></div>');
    function upd(p) {
      $('.gpx-sticky__th', node).innerHTML = hasSrc(p.imagen) ? '<img src="' + esc(p.imagen) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:11px">' : matThumb(p.unidades || 1);
      $('.gpx-sticky__n', node).innerHTML = tx(p.nombre) + ' · ' + tx(p.descripcion);
      $('.gpx-sticky__p', node).innerHTML = (p._precio != null ? money(p._precio) : tx(p.precio)) + (p._comparar ? '<s>' + money(p._comparar) + '</s>' : '');
    }
    upd(packActual()); ONPACK.push(upd);
    WIRE.push(function () {
      $('.gpx-sticky__b', node).addEventListener('click', function () {
        var b = botonEl();
        setQty(1); aplicarVariante(packActual().variante); aplicarTalle();
        if (b) b.click(); else irAlBundle();
      });
      var bundle = $('#gpx-bundle');
      function chk() {
        var past = anchor.getBoundingClientRect().bottom < 0;
        var near = bundle ? bundle.getBoundingClientRect().top < window.innerHeight && bundle.getBoundingClientRect().bottom > 0 : false;
        var on = past && !near;
        node.classList.toggle('is-on', on); node.setAttribute('aria-hidden', !on);
      }
      window.addEventListener('scroll', chk, { passive: true }); window.addEventListener('resize', chk); chk();
    });
    return node;
  }

  function buildBelow() {
    var wrap = el('<div class="gpx-root gpx-below"></div>');
    [buildCinta, buildProblema,
      function () { return buildImgTexto(CONFIG.instinto, false, ''); },
      buildAlfombra, buildMetodo, buildPantalla, buildPasos, buildPlan, buildHabilidades, buildComparativa, buildResenas, buildFAQ, buildCierre
    ].forEach(function (fn) { var n = fn(); if (n) wrap.appendChild(n); });
    return wrap;
  }

  /* Coloca la sección de abajo debajo de la ficha (no dentro de la columna angosta) y a ancho completo */
  function ubicarAbajo(node, formRow) {
    var d = descEl();
    var vw = document.documentElement.clientWidth, lim = Math.min(vw * 0.85, 900);
    var n = d || formRow;
    while (n.parentElement && n.parentElement !== document.body && n.parentElement.getBoundingClientRect().width < lim) n = n.parentElement;
    // si quedó dentro de una fila flex/grid (columnas del theme), salir de la fila
    while (n.parentElement && n.parentElement !== document.body && /flex|grid/.test(getComputedStyle(n.parentElement).display)) n = n.parentElement;
    after(n, node);
    node.style.setProperty('flex', '0 0 auto', 'important');
    node.style.setProperty('max-width', 'none', 'important');
    function fit() {
      node.style.marginLeft = '0px'; node.style.width = 'auto';
      var w = document.documentElement.clientWidth, r = node.getBoundingClientRect();
      node.style.width = w + 'px'; node.style.marginLeft = (-r.left) + 'px';
    }
    fit();
    var t; window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(fit, 120); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  }

  /* =====================================================================
     MONTAJE
     ===================================================================== */
  function mount() {
    if (window.__gpxMounted) return true;
    var title = tituloEl(), btn = botonEl();
    if (!title || !btn) return false;
    window.__gpxMounted = true;

    prepararPacks();
    injectCSS();

    if (CONFIG.barraSuperior.activar) document.body.insertBefore(buildTopBar(), document.body.firstChild);
    if (CONFIG.rating.activar) before(title, buildRating());
    after(title, buildIntro());

    var formRow = btn.closest('.js-product-form') || btn.closest('form') || btn.parentElement;
    before(formRow, buildBundle());
    after(formRow, buildAfter());

    (function () {
      var p = btn.parentElement;
      while (p && p !== formRow && p !== document.body) {
        p.style.setProperty('width', '100%', 'important'); p.style.setProperty('max-width', '100%', 'important'); p.style.setProperty('float', 'none', 'important');
        p = p.parentElement;
      }
    })();

    var below = buildBelow();
    ubicarAbajo(below, formRow);

    if (CONFIG.barraFija.activar) document.body.appendChild(buildSticky(formRow));

    WIRE.forEach(function (fn) { try { fn(); } catch (e) { if (window.console) console.warn('[landing]', e); } });
    WIRE = [];

    $$('.gpx-root video').forEach(function (v) { v.muted = true; var p = v.play && v.play(); if (p && p.catch) p.catch(function () {}); });

    var ok = aplicarVariante(packActual().variante);
    var okT = aplicarTalle();
    setQty(1);
    if (ok && okT && CONFIG.ocultar.variantesNativas) ocultarVariantesNativas();
    if (ok && !okT && window.console) console.warn('[landing] No encontré el talle "' + talleValor(packActual()) + '" en las variantes. Creá la propiedad "Talle de medias" (ver instrucciones arriba) o poné CONFIG.regalo.talles.activar: false. El selector nativo queda visible.');
    if (!ok && window.console) console.warn('[landing] No encontré la variante "' + packActual().variante + '". Revisá que los nombres de las variantes coincidan con CONFIG.bundle.paquetes[].variante. El selector nativo queda visible.');

    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (en) { en.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } }); }, { threshold: .08, rootMargin: '0px 0px -40px 0px' });
      $$('.gpx-reveal').forEach(function (n) { io.observe(n); });
    } else $$('.gpx-reveal').forEach(function (n) { n.classList.add('is-in'); });
    return true;
  }

  function boot() { if (mount()) return; var tries = 0, iv = setInterval(function () { tries++; if (mount() || tries > 60) clearInterval(iv); }, 200); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
